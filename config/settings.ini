; Необязательный файл. Положите рядом с SnackReport.exe, если нужно поменять настройки.
[paths]
; Папка с выгрузками UCS и отчётами (относительно exe или абсолютный путь)
reports_dir = report
; Свой шаблон для первого отчёта (по умолчанию используется встроенный в exe)
; template = шаблон.xlsx

[report]
; Строки-разделы: не товары, копируются как есть. Новые товары из UCS вставляются перед первой из них.
section_rows = Прочее
; Персонал и карты: не товары, очищаются каждый день
staff_rows = Утеря карт, Наличие карт, Администратор, Тех персонал, Охрана
; Группы услуг UCS, которые целиком не попадают в отчёт
ignored_groups = Посещения
; Отдельные услуги UCS, которые не попадают в отчёт (абонементы, посещения). * — любые символы.
ignored = Акция * посещени*, Безлимит*

[aliases]
; Название в UCS = строка отчёта. Продажа товара из UCS пишется в указанную строку.
; Эти сопоставления уже встроены в программу; здесь можно добавить новые или поменять их.
Протеин 30гр = Протеин в пачках штучно
протеиновый коктейль (на молоке) = Протеин порц
протеиновый коктейль на воде = Протеин порц
конфета 20 грамм = Конфеты штучно
RedBull 0.25 = Ред Булл
Бомбар Витамин и минерал = Энергетик Бомбар Вит мин
Вода 1 л = Вода 1
Вода 1,5 л = Вода 1,5
энергетик вейк апп = энергетик вейкапп
утеря карточки = Утеря карт

[price_split]
; Услуга UCS, которая по цене за штуку идёт в разные строки отчёта: Название в UCS = цена: строка; цена: строка
; Работает и для услуг из пропускаемых групп (например, «Посещения»).
Разовые зал Бокс = 4000: Разовые посещения зал; 5000: Разовое Бокс
